<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b0c"><title>The Crypt of the Hollow King</title><link rel="stylesheet" href="style.css"></head>
<body><main id="game">
<header><div><h1>THE CRYPT OF THE HOLLOW KING</h1><p id="story">The iron door crashes shut behind you.</p></div><button id="restart">Restart</button></header>
<section class="viewport"><canvas id="view" width="800" height="500"></canvas><div id="banner"></div></section>
<section id="party"></section>
<section class="controls">
<div class="move"><span></span><button data-act="forward">▲</button><span></span><button data-act="left">↶</button><button data-act="back">▼</button><button data-act="right">↷</button></div>
<div class="actions"><button data-act="attack" class="primary">ATTACK</button><button data-act="skill">SKILL</button><button data-act="use">USE</button><button data-act="search">SEARCH</button><button data-act="map">MAP</button><button data-act="rest">REST</button></div>
</section>
<section class="hud"><span id="inventory">Keys 0 · Gold 0 · Potions 2</span><p id="log">Torchlight dances across ancient stone. Find another way out.</p></section>
<footer>W/↑ forward · S/↓ back · A/D turn · J attack · K skill · E use · Q search · M map</footer>
</main><script src="game.js"></script></body></html>
